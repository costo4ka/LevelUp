# Сборка LevelUp под Windows x64 и Linux x64.
# Пуш в main: тесты, PyInstaller, проверка запуска, архивы в артефактах запуска (вкладка Actions).
# Пуш тега v*: то же самое и релиз с готовыми архивами (вкладка Releases).
name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Windows x64
            os: windows-latest
            archive: LevelUp-windows-x64.zip
            artifact: LevelUp-windows-x64
          - title: Linux x64
            os: ubuntu-22.04
            archive: LevelUp-linux-x64.tar.gz
            artifact: LevelUp-linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Библиотеки Qt для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Автотесты
        env:
          QT_QPA_PLATFORM: offscreen
        # Ширина виджета зависит от системного шрифта раннера, поэтому этот тест здесь пропущен и проверяется локально.
        run: >-
          python -m pytest -q --junitxml=pytest-report.xml
          --deselect tests/test_ui_windows.py::test_overlay_is_narrow_and_compact_scene_is_scaled_by_two

      - name: Список упавших тестов
        if: failure()
        shell: python {0}
        env:
          PYTHONUTF8: "1"
        run: |
          import os
          import xml.etree.ElementTree as ET

          if os.path.exists("pytest-report.xml"):
              for case in ET.parse("pytest-report.xml").getroot().iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is not None:
                      first = (bad.get("message") or "").splitlines()
                      print(f"::error title=pytest::{case.get('classname')}.{case.get('name')}: {first[0] if first else ''}")

      - name: Сборка PyInstaller
        run: python -m PyInstaller levelup.spec --noconfirm --clean

      - name: Архив (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Force -Path dist\LevelUp -DestinationPath dist\${{ matrix.archive }}

      - name: Архив (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/${{ matrix.archive }} LevelUp

      - name: Проверка запуска (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          LEVELUP_DATA_DIR: ${{ runner.temp }}\levelup-smoke
        run: |
          Expand-Archive -Path dist\${{ matrix.archive }} -DestinationPath "$env:RUNNER_TEMP\unpacked"
          $app = Start-Process -FilePath "$env:RUNNER_TEMP\unpacked\LevelUp\LevelUp.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            Write-Host "::error::App exited with code $($app.ExitCode) before the timeout"
            exit 1
          }
          Stop-Process -Id $app.Id -Force
          if (-not (Test-Path "$env:LEVELUP_DATA_DIR\data.db")) {
            Write-Host "::error::data.db was not created"
            exit 1
          }
          Write-Host "App started, database created"

      - name: Проверка запуска (Linux)
        if: runner.os == 'Linux'
        env:
          LEVELUP_DATA_DIR: ${{ runner.temp }}/levelup-smoke
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "dist/${{ matrix.archive }}" -C "$RUNNER_TEMP/unpacked"
          rc=0
          xvfb-run -a timeout 12 "$RUNNER_TEMP/unpacked/LevelUp/LevelUp" || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "::error::App exited with code $rc before the timeout"
            exit 1
          fi
          test -f "$LEVELUP_DATA_DIR/data.db" || { echo "::error::data.db was not created"; exit 1; }
          echo "App started, database created"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Контрольные суммы и описание релиза
        run: |
          (cd dist && sha256sum LevelUp-* > SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          **Windows 10/11 x64.** Распакуйте `LevelUp-windows-x64.zip` и запустите `LevelUp\LevelUp.exe`. Python и права администратора не нужны. Файл не подписан, поэтому SmartScreen может показать предупреждение: «Подробнее» → «Выполнить в любом случае».

          **Linux x64 (X11, Ubuntu 22.04 и новее).** `tar xzf LevelUp-linux-x64.tar.gz`, затем `./LevelUp/LevelUp`. Нужна библиотека `libxcb-cursor0`: `sudo apt install libxcb-cursor0`.

          Данные хранятся в `%LOCALAPPDATA%\LevelUp` (Windows) и `~/.local/share/LevelUp` (Linux). Контрольные суммы лежат в `SHA256SUMS.txt`.

          Код распространяется по GPL-3.0. Графика героя взята из Universal LPC Spritesheet Character Generator (CC-BY-SA 3.0 / GPL 3.0 / OGA-BY 3.0), авторы указаны в окне «О программе».
          EOF

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LevelUp $GITHUB_REF_NAME" \
            --notes-file notes.md
